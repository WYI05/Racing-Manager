<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SABLE Racing Manager</title>
<meta name="description" content="Multi-race pit wall manager: quali times, lap logging, stint records, rival positions, and analysis.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#0e1218; --panel:#161c25; --panel-2:#1c2430; --line:#2a3442;
    --ink:#e9eef5; --ink-dim:#9fadbf; --ink-faint:#6b7889;
    --amber:#ffb000; --red:#ff5a5a; --green:#41d98d; --cyan:#4fc3f7;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --disp:"Saira Condensed","Arial Narrow",Impact,sans-serif;
    --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  }
  html{color-scheme:dark}
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0;padding:0 14px 90px}
  .wrap{max-width:1060px;margin:0 auto}
  a{color:var(--cyan)}
  h1,h2,h3{font-family:var(--disp);text-transform:uppercase;letter-spacing:.02em;margin:0}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* Header */
  header{padding:22px 0 14px;border-bottom:3px solid var(--amber);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end}
  .brand .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber)}
  .brand h1{font-size:clamp(30px,5vw,44px);font-weight:800;line-height:.95}
  .brand h1 .thin{color:var(--ink-dim);font-weight:600}
  .hdr-tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}

  select,input,textarea,button{font-family:inherit;font-size:14px;color:var(--ink)}
  select,input[type=text],input[type=date],input[type=time],input[type=number],input[type=url],textarea{
    background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
  input[type=number]{font-family:var(--mono)}
  textarea{width:100%;min-height:70px;resize:vertical}
  ::placeholder{color:var(--ink-faint)}

  button{cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);padding:8px 14px}
  button:hover{border-color:var(--amber);color:var(--amber)}
  button.primary{background:var(--amber);border-color:var(--amber);color:#1a1205;font-weight:700}
  button.primary:hover{filter:brightness(1.08);color:#1a1205}
  button.danger{color:var(--red)}
  button.danger:hover{border-color:var(--red)}
  button.mini{padding:3px 9px;font-size:12px}
  button.ghost{background:none}

  /* Tabs */
  nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 0}
  .tabs button{font-family:var(--disp);text-transform:uppercase;font-size:17px;letter-spacing:.04em;padding:8px 18px;border-radius:6px 6px 0 0;border-bottom:none;color:var(--ink-dim)}
  .tabs button.on{background:var(--panel);color:var(--amber);border-color:var(--line)}

  section.pane{background:var(--panel);border:1px solid var(--line);border-radius:0 8px 8px 8px;padding:20px 22px 24px;margin-bottom:26px}
  .pane h2{font-size:22px;color:var(--ink);margin-bottom:10px}
  .hint{color:var(--ink-faint);font-size:13px;max-width:75ch}

  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px 16px}
  .field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:4px}
  .field input,.field select{width:100%}

  /* Tables */
  .tbl-wrap{overflow-x:auto;margin:12px 0}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-dim);text-align:left;padding:7px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
  td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  td input,td select{width:100%;min-width:56px;padding:5px 7px}
  td input.num{max-width:74px;text-align:center;font-family:var(--mono)}
  tr:last-child td{border-bottom:none}
  .best{color:var(--amber);font-weight:600}

  .pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;padding:2px 10px;border-radius:999px;background:rgba(159,173,191,.12);color:var(--ink-dim);white-space:nowrap}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}

  .callout{border-left:3px solid var(--amber);background:var(--panel-2);padding:10px 14px;border-radius:0 6px 6px 0;margin:12px 0;max-width:80ch;font-size:14px}

  /* Timers */
  .tools-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;margin:6px 0 16px}
  .tool{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  .tool h3{font-size:17px;color:var(--ink-dim);margin-bottom:8px}
  .clockface{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:42px;font-weight:600;line-height:1}
  .clockface.warn{color:var(--amber)}
  .clockface.crit{color:var(--red)}
  .board-prompt{font-family:var(--mono);font-size:13px;letter-spacing:.1em;margin:8px 0 10px;min-height:1.3em;color:var(--amber)}
  .board-prompt.crit{color:var(--red);animation:flash 1s steps(2) infinite}
  @keyframes flash{50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.board-prompt.crit{animation:none}}
  .btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

  /* Stint expand */
  tr.laprow>td{background:rgba(255,176,0,.04);padding:12px 14px}
  .laps-list{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .lap-chip{font-family:var(--mono);font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:3px 7px;display:inline-flex;gap:7px;align-items:center}
  .lap-chip.best{border-color:var(--amber);color:var(--amber)}
  .lap-chip button{border:none;background:none;padding:0;color:var(--ink-faint);font-size:12px;line-height:1}
  .lap-chip button:hover{color:var(--red)}

  /* Stats */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:8px 0 14px}
  .tile{background:var(--panel-2);padding:12px 14px}
  .tile .k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
  .tile .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:24px;font-weight:600;margin-top:3px}
  .tile .s{font-size:12px;color:var(--ink-dim)}

  .chart-wrap{overflow-x:auto}
  .chart-wrap svg{min-width:560px;width:100%;height:auto;display:block}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin:8px 0 2px;font-size:13px;color:var(--ink-dim)}
  .legend .pill{background:none;padding:0}

  footer{margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--ink-faint);display:flex;flex-wrap:wrap;gap:6px 22px}
  .hidden{display:none}
  @media (max-width:640px){ section.pane{padding:14px 12px 18px} body{font-size:14px} }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="brand">
    <div class="eyebrow">Pit wall data &middot; multi-race</div>
    <h1>SABLE <span class="thin">Racing Manager</span></h1>
  </div>
  <div class="hdr-tools">
    <select id="raceSel" aria-label="Select race"></select>
    <button id="newRace" class="mini">+ New race</button>
    <button id="exportBtn" class="mini ghost">Export</button>
    <button id="importBtn" class="mini ghost">Import</button>
    <input type="file" id="importFile" accept="application/json" class="hidden">
  </div>
</header>

<nav class="tabs" id="tabs"></nav>
<section class="pane" id="pane"></section>

<footer>
  <div>SABLE Motorsports &middot; data stays on this device (localStorage) &mdash; use Export/Import to sync phones</div>
  <div id="footLink"></div>
</footer>

</div>

<script>
"use strict";
/* ---------- palette: UI (bright) + chart marks (validated for dark surface) ---------- */
var PAL = [
  {ui:"#ffb000", mark:"#c18400", name:"amber"},
  {ui:"#4fc3f7", mark:"#1e8fc2", name:"cyan"},
  {ui:"#41d98d", mark:"#1f9e63", name:"green"},
  {ui:"#c792ea", mark:"#9166c9", name:"violet"}
];
var RIVAL_C = "#8a94a3";

/* ---------- storage ---------- */
var KEY = "sable-rm-v1";
var store = null;
function load(){
  try { store = JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e){ store = null; }
  if (!store || !store.races) store = seed();
  Object.keys(store.races).forEach(function(id){ normalize(store.races[id]); });
  if (!store.races[store.currentId]) store.currentId = Object.keys(store.races)[0];
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }
function uid(){ return Math.random().toString(36).slice(2,9); }
function cur(){ return store.races[store.currentId]; }

function seed(){
  var vegas = {
    meta:{ name:"SABLE Motorsports", event:"Vegas 3H Endurance (SWS)", track:"Vegas Superkarts — Las Vegas, NV",
      date:"2026-09-05", green:"19:00", stints:9, stintMin:20, link:"vegas-race-book.html",
      notes:"Ref US-VEG-142967 · Exotics Racing 702-405-7223 · payment due Sep 4 4PM PT · no radios · ballast yes" },
    drivers:[ {id:uid(), name:"William Yi", c:0}, {id:uid(), name:"Matthew Hergenroeder", c:1} ],
    quali:{ times:{}, grid:"" },
    stints:[], rivals:[], ourPos:[]
  };
  return { currentId:"vegas2026", races:{ vegas2026: vegas } };
}
function normalize(r){
  r.meta.stints = Math.max(1, Math.min(40, +r.meta.stints || 9));
  var n = r.meta.stints;
  r.stints = r.stints || [];
  while (r.stints.length < n) r.stints.push({d:"", kart:"", ps:"", pe:"", best:"", notes:"", laps:[]});
  r.stints.length = n;
  r.stints.forEach(function(s){ s.laps = s.laps || []; });
  r.ourPos = (r.ourPos || []).slice(0, n); while (r.ourPos.length < n) r.ourPos.push("");
  (r.rivals || []).forEach(function(rv){ rv.pos = (rv.pos || []).slice(0, n); while (rv.pos.length < n) rv.pos.push(""); });
  r.rivals = r.rivals || [];
  r.quali = r.quali || {times:{}, grid:""};
  r.quali.times = r.quali.times || {};
}

/* ---------- time helpers ---------- */
function parseLap(s){
  s = String(s || "").trim();
  var m = s.match(/^(?:(\d+):)?(\d{1,2}(?:[.,]\d{1,3})?)$/);
  if (!m) return null;
  var sec = parseFloat(m[2].replace(",", "."));
  if (isNaN(sec) || sec >= 60 && m[1]) return null;
  var ms = Math.round(((+m[1] || 0) * 60 + sec) * 1000);
  return ms > 0 ? ms : null;
}
function fmtLap(ms){
  if (ms == null || isNaN(ms)) return "—";
  var mm = Math.floor(ms / 60000), s = (ms % 60000) / 1000;
  var str = s.toFixed(3); if (mm && s < 10) str = "0" + str;
  return mm ? mm + ":" + str : str;
}
function fmtClock(t){
  t = Math.max(0, Math.round(t));
  return String(Math.floor(t/60)).padStart(2,"0") + ":" + String(t%60).padStart(2,"0");
}
function stintWindow(meta, i){
  if (!meta.green) return "";
  var p = meta.green.split(":"), t = (+p[0])*60 + (+p[1] || 0) + i * (+meta.stintMin || 0);
  var h = Math.floor(t/60) % 24, mn = t % 60;
  var ampm = h >= 12 ? "PM" : "AM", hh = h % 12 || 12;
  return hh + ":" + String(mn).padStart(2,"0") + " " + ampm;
}
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function mean(a){ return a.length ? a.reduce(function(x,y){return x+y;},0)/a.length : null; }
function sdev(a){ if (a.length < 2) return null; var m = mean(a); return Math.sqrt(a.reduce(function(x,y){return x+(y-m)*(y-m);},0)/(a.length-1)); }
function driverById(r, id){ return r.drivers.find(function(d){ return d.id === id; }) || null; }
function dcol(r, id){ var d = driverById(r, id); return d ? PAL[d.c % PAL.length] : {ui:"#6b7889", mark:"#6b7889"}; }
function allLaps(r){
  var out = [];
  r.stints.forEach(function(s, si){ s.laps.forEach(function(ms, li){ out.push({ms:ms, si:si, li:li, d:s.d}); }); });
  return out;
}
function stintBest(s){ return s.laps.length ? Math.min.apply(null, s.laps) : (parseLap(s.best) || null); }

/* ---------- app state (not persisted) ---------- */
var tab = "setup";
var openStint = -1;
var sw = { running:false, t0:0, lastLap:0, stint:0 };  // stopwatch
var cd = { running:false, endAt:0 };                    // countdown
var TABS = [["setup","Setup"],["quali","Quali"],["race","Race"],["rivals","Rivals"],["analysis","Analysis"]];

/* ---------- header ---------- */
function renderHeader(){
  var sel = document.getElementById("raceSel");
  sel.innerHTML = Object.keys(store.races).map(function(id){
    var r = store.races[id];
    return '<option value="' + id + '"' + (id === store.currentId ? " selected" : "") + '>' + esc(r.meta.event || r.meta.name || id) + '</option>';
  }).join("");
  var fl = document.getElementById("footLink"), link = cur().meta.link;
  fl.innerHTML = link ? '<a href="' + esc(link) + '">race briefing &rarr;</a>' : "";
}
function renderTabs(){
  document.getElementById("tabs").innerHTML = TABS.map(function(t){
    return '<button data-tab="' + t[0] + '" class="' + (tab === t[0] ? "on" : "") + '">' + t[1] + '</button>';
  }).join("");
}

/* ---------- SETUP ---------- */
function paneSetup(){
  var r = cur(), m = r.meta;
  var h = '<h2>Race setup</h2><div class="grid2">'
    + fld("Event name","event",m.event,"text","e.g. Vegas 3H Endurance")
    + fld("Team name","name",m.name,"text","")
    + fld("Track","track",m.track,"text","")
    + fld("Date","date",m.date,"date","")
    + fld("Green flag","green",m.green,"time","")
    + fld("Stints","stints",m.stints,"number","")
    + fld("Stint length (min)","stintMin",m.stintMin,"number","")
    + fld("Briefing link (optional)","link",m.link,"url","https://…")
    + '</div>'
    + '<div class="field" style="margin-top:12px"><label>Notes</label><textarea data-meta="notes">' + esc(m.notes) + '</textarea></div>';

  h += '<h2 style="margin-top:22px">Drivers</h2><div class="tbl-wrap"><table><thead><tr><th>Driver</th><th>Color</th><th></th></tr></thead><tbody>';
  r.drivers.forEach(function(d, i){
    h += '<tr><td><input type="text" value="' + esc(d.name) + '" data-drv="' + d.id + '"></td>'
      + '<td><select data-drvc="' + d.id + '">' + PAL.map(function(p, ci){
          return '<option value="' + ci + '"' + (d.c === ci ? " selected" : "") + '>' + p.name + '</option>'; }).join("") + '</select></td>'
      + '<td><button class="mini danger" data-deldrv="' + d.id + '">remove</button></td></tr>';
  });
  h += '</tbody></table></div><button class="mini" id="addDrv">+ Add driver</button>';
  h += '<div class="callout">Data lives in this browser only. Before race day, <b>Export</b> a backup and <b>Import</b> it on the second phone — then export again after the race to merge notes.</div>';
  h += '<div style="margin-top:18px;border-top:1px dashed var(--line);padding-top:14px"><button class="danger mini" id="delRace">Delete this race</button></div>';
  return h;
}
function fld(label, key, val, type, ph){
  return '<div class="field"><label>' + label + '</label><input type="' + type + '" value="' + esc(val) + '" placeholder="' + esc(ph) + '" data-meta="' + key + '"' + (type === "number" ? ' min="1" max="60"' : "") + '></div>';
}

/* ---------- QUALI ---------- */
function paneQuali(){
  var r = cur();
  var h = '<h2>Qualifying</h2><p class="hint">Log every push lap per driver — enter times like <span class="mono">51.234</span> or <span class="mono">1:02.5</span>. Best lap is picked automatically.</p>';
  h += '<div class="grid2" style="margin-top:12px;align-items:start">';
  r.drivers.forEach(function(d){
    var times = r.quali.times[d.id] || [];
    var best = times.length ? Math.min.apply(null, times) : null;
    var col = PAL[d.c % PAL.length].ui;
    h += '<div class="tool"><h3 style="color:' + col + '">' + esc(d.name) + '</h3>'
      + '<div class="btn-row"><input type="text" class="mono" style="max-width:130px" placeholder="lap time" data-qadd="' + d.id + '">'
      + '<button class="mini" data-qbtn="' + d.id + '">Add</button>'
      + (best ? '<span class="pill"><span class="dot" style="background:' + col + '"></span>best ' + fmtLap(best) + '</span>' : "")
      + '</div><div class="laps-list">'
      + times.map(function(ms, i){
          return '<span class="lap-chip' + (ms === best ? " best" : "") + '">' + fmtLap(ms)
            + '<button title="delete" data-qdel="' + d.id + ':' + i + '">&times;</button></span>';
        }).join("")
      + '</div></div>';
  });
  h += '</div><div class="field" style="max-width:220px;margin-top:14px"><label>Grid position</label><input type="text" class="mono" value="' + esc(r.quali.grid) + '" data-grid placeholder="e.g. P4"></div>';
  return h;
}

/* ---------- RACE ---------- */
function paneRace(){
  var r = cur(), m = r.meta;
  var h = '<h2>Race</h2>';
  /* timers */
  h += '<div class="tools-row">';
  var rem = cd.running ? (cd.endAt - Date.now())/1000 : m.stintMin*60;
  h += '<div class="tool"><h3>Stint countdown &middot; ' + m.stintMin + ' min</h3>'
    + '<div class="clockface" id="cdFace">' + fmtClock(rem) + '</div>'
    + '<div class="board-prompt" id="cdPrompt"></div>'
    + '<div class="btn-row"><button class="primary mini" id="cdStart">' + (cd.running ? "Restart" : "Start stint") + '</button>'
    + '<button class="mini" id="cdStop">Reset</button></div>'
    + '<p class="hint" style="margin:8px 0 0">Prompts follow the signal book: board at 5:00 and 3:00, IN NOW at 1:00.</p></div>';
  h += '<div class="tool"><h3>Lap stopwatch &rarr; logs to stint</h3>'
    + '<div class="clockface" id="swFace">' + (sw.running ? "" : "00:00") + '</div>'
    + '<div class="board-prompt mono" id="swLast">' + (sw.running ? "" : "&nbsp;") + '</div>'
    + '<div class="btn-row">'
    + '<select id="swStint">' + r.stints.map(function(s, i){ return '<option value="' + i + '"' + (sw.stint === i ? " selected" : "") + '>S' + (i+1) + '</option>'; }).join("") + '</select>'
    + (sw.running
        ? '<button class="primary mini" id="swLap">LAP</button><button class="mini" id="swStop">Stop</button>'
        : '<button class="primary mini" id="swGo">Start</button>')
    + '</div></div>';
  h += '</div>';

  /* stint table */
  h += '<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Start</th><th>Driver</th><th>Kart</th><th>Pos in</th><th>Pos out</th><th>Best lap</th><th>Laps</th><th>Notes</th><th></th></tr></thead><tbody>';
  r.stints.forEach(function(s, i){
    var best = stintBest(s);
    var col = s.d ? dcol(r, s.d).ui : null;
    h += '<tr>'
      + '<td class="mono">S' + (i+1) + '</td>'
      + '<td class="mono">' + stintWindow(m, i) + '</td>'
      + '<td><select data-sd="' + i + '"><option value="">—</option>' + r.drivers.map(function(d){
          return '<option value="' + d.id + '"' + (s.d === d.id ? " selected" : "") + '>' + esc(d.name.split(" ")[0]) + '</option>'; }).join("") + '</select></td>'
      + '<td><input class="num" type="text" value="' + esc(s.kart) + '" data-sk="' + i + '"></td>'
      + '<td><input class="num" type="text" value="' + esc(s.ps) + '" data-sps="' + i + '"></td>'
      + '<td><input class="num" type="text" value="' + esc(s.pe) + '" data-spe="' + i + '"></td>'
      + '<td class="mono">' + (s.laps.length
          ? '<span class="best">' + fmtLap(best) + '</span>'
          : '<input class="num" type="text" value="' + esc(s.best) + '" data-sb="' + i + '" placeholder="—">') + '</td>'
      + '<td class="mono">' + (s.laps.length || "") + '</td>'
      + '<td><input type="text" value="' + esc(s.notes) + '" data-sn="' + i + '" placeholder=""></td>'
      + '<td><button class="mini" data-open="' + i + '">' + (openStint === i ? "close" : "laps") + '</button></td>'
      + '</tr>';
    if (openStint === i){
      h += '<tr class="laprow"><td colspan="10">'
        + '<div class="btn-row"><b style="font-family:var(--disp);text-transform:uppercase' + (col ? ";color:" + col : "") + '">S' + (i+1) + ' laps</b>'
        + '<input type="text" class="mono" style="max-width:120px" placeholder="add lap" data-ladd="' + i + '">'
        + '<button class="mini" data-lbtn="' + i + '">Add</button>'
        + (s.laps.length ? '<span class="pill">best ' + fmtLap(best) + '</span><span class="pill">avg ' + fmtLap(mean(s.laps)) + '</span>' : "")
        + '</div><div class="laps-list">'
        + s.laps.map(function(ms, li){
            return '<span class="lap-chip' + (ms === best ? " best" : "") + '">L' + (li+1) + ' &middot; ' + fmtLap(ms)
              + '<button title="delete" data-ldel="' + i + ':' + li + '">&times;</button></span>'; }).join("")
        + '</div></td></tr>';
    }
  });
  h += '</tbody></table></div>';
  return h;
}

/* ---------- RIVALS ---------- */
function paneRivals(){
  var r = cur(), n = r.meta.stints;
  var h = '<h2>Rivals &amp; positions</h2><p class="hint">Enter each team’s position at the end of every stint. Your team is the first row.</p>';
  h += '<div class="btn-row" style="margin:10px 0"><input type="text" id="rivName" placeholder="rival team name" style="max-width:220px"><button class="mini" id="rivAdd">+ Add rival</button></div>';
  h += '<div class="tbl-wrap"><table><thead><tr><th>Team</th>';
  for (var i = 0; i < n; i++) h += '<th class="mono">S' + (i+1) + '</th>';
  h += '<th></th></tr></thead><tbody>';
  h += '<tr><td><span class="pill"><span class="dot" style="background:' + PAL[0].ui + '"></span>' + esc(r.meta.name) + '</span></td>';
  for (var i2 = 0; i2 < n; i2++) h += '<td><input class="num" type="text" inputmode="numeric" value="' + esc(r.ourPos[i2]) + '" data-op="' + i2 + '"></td>';
  h += '<td></td></tr>';
  r.rivals.forEach(function(rv, ri){
    h += '<tr><td><input type="text" value="' + esc(rv.name) + '" data-rvn="' + ri + '" style="min-width:130px"></td>';
    for (var j = 0; j < n; j++) h += '<td><input class="num" type="text" inputmode="numeric" value="' + esc(rv.pos[j]) + '" data-rp="' + ri + ':' + j + '"></td>';
    h += '<td><button class="mini danger" data-rvdel="' + ri + '">&times;</button></td></tr>';
  });
  h += '</tbody></table></div>';
  h += posChart(r);
  return h;
}
function posChart(r){
  var n = r.meta.stints;
  var teams = [{name:r.meta.name, pos:r.ourPos, us:true}].concat(r.rivals.map(function(rv){ return {name:rv.name, pos:rv.pos, us:false}; }));
  var pts = teams.map(function(t){
    return t.pos.map(function(p, i){ var v = parseInt(p, 10); return isNaN(v) ? null : {x:i, y:v}; }).filter(Boolean);
  });
  if (!pts.some(function(a){ return a.length; })) return '<p class="hint">Position trace appears here once positions are entered.</p>';
  var maxP = 1; pts.forEach(function(a){ a.forEach(function(p){ if (p.y > maxP) maxP = p.y; }); });
  var W = 720, H = 60 + maxP * 24, L = 40, R = 110, T = 18, B = 30;
  var xs = function(x){ return L + (n === 1 ? 0 : x * (W - L - R) / (n - 1)); };
  var ys = function(y){ return T + (y - 1) * (H - T - B) / Math.max(1, maxP - 1); };
  var s = '<h2 style="margin-top:20px">Position trace</h2><div class="legend"><span class="pill"><span class="dot" style="background:' + PAL[0].mark + '"></span>' + esc(r.meta.name) + '</span><span class="pill"><span class="dot" style="background:' + RIVAL_C + '"></span>rivals</span></div>';
  s += '<div class="chart-wrap"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Race position by stint">';
  for (var p = 1; p <= maxP; p++)
    s += '<line x1="' + L + '" y1="' + ys(p) + '" x2="' + (W - R) + '" y2="' + ys(p) + '" stroke="#2a3442" stroke-width="1"/>'
      + '<text x="' + (L - 8) + '" y="' + (ys(p) + 3.5) + '" fill="#6b7889" font-family="IBM Plex Mono,monospace" font-size="11" text-anchor="end">P' + p + '</text>';
  for (var xi = 0; xi < n; xi++)
    s += '<text x="' + xs(xi) + '" y="' + (H - 8) + '" fill="#6b7889" font-family="IBM Plex Mono,monospace" font-size="11" text-anchor="middle">S' + (xi+1) + '</text>';
  teams.forEach(function(t, ti){
    var a = pts[ti]; if (!a.length) return;
    var col = t.us ? PAL[0].mark : RIVAL_C, wdt = t.us ? 3 : 2;
    if (a.length > 1)
      s += '<path d="M' + a.map(function(p){ return xs(p.x) + " " + ys(p.y); }).join(" L") + '" fill="none" stroke="' + col + '" stroke-width="' + wdt + '" stroke-linejoin="round" stroke-linecap="round"' + (t.us ? "" : ' opacity=".8"') + '/>';
    a.forEach(function(p){
      s += '<circle cx="' + xs(p.x) + '" cy="' + ys(p.y) + '" r="4" fill="' + col + '" stroke="#161c25" stroke-width="2"><title>' + esc(t.name) + ' — S' + (p.x+1) + ': P' + p.y + '</title></circle>';
    });
    var last = a[a.length - 1];
    s += '<text x="' + (xs(last.x) + 10) + '" y="' + (ys(last.y) + 4) + '" fill="' + (t.us ? "#e9eef5" : "#9fadbf") + '" font-family="Archivo,sans-serif" font-size="12">' + esc(t.name.length > 14 ? t.name.slice(0,13) + "…" : t.name) + '</text>';
  });
  s += '</svg></div>';
  return s;
}

/* ---------- ANALYSIS ---------- */
function paneAnalysis(){
  var r = cur(), laps = allLaps(r);
  var h = '<h2>Analysis</h2>';
  if (!laps.length){
    var manual = r.stints.map(stintBest).filter(Boolean);
    h += '<p class="hint">Log laps in the Race tab (stopwatch or typed) and this page fills itself in.' + (manual.length ? ' Best recorded stint time so far: <span class="mono best">' + fmtLap(Math.min.apply(null, manual)) + '</span>.' : "") + '</p>';
    return h;
  }
  var times = laps.map(function(l){ return l.ms; });
  var best = Math.min.apply(null, times);
  var bl = laps.find(function(l){ return l.ms === best; });
  var bd = driverById(r, bl.d);
  h += '<div class="tiles">'
    + tile("Best lap", fmtLap(best), (bd ? esc(bd.name.split(" ")[0]) : "?") + " · S" + (bl.si+1))
    + tile("Average", fmtLap(mean(times)), laps.length + " laps logged")
    + tile("Consistency σ", (sdev(times) != null ? (sdev(times)/1000).toFixed(3) + "s" : "—"), "lower = steadier")
    + tile("Stints filled", r.stints.filter(function(s){ return s.laps.length; }).length + "/" + r.meta.stints, "with lap data")
    + '</div>';

  /* per-driver table */
  h += '<div class="tbl-wrap"><table><thead><tr><th>Driver</th><th>Laps</th><th>Best</th><th>Avg</th><th>σ (s)</th></tr></thead><tbody>';
  r.drivers.forEach(function(d){
    var dl = laps.filter(function(l){ return l.d === d.id; }).map(function(l){ return l.ms; });
    if (!dl.length) return;
    var col = PAL[d.c % PAL.length].ui;
    h += '<tr><td><span class="pill"><span class="dot" style="background:' + col + '"></span>' + esc(d.name) + '</span></td>'
      + '<td class="mono">' + dl.length + '</td>'
      + '<td class="mono best">' + fmtLap(Math.min.apply(null, dl)) + '</td>'
      + '<td class="mono">' + fmtLap(mean(dl)) + '</td>'
      + '<td class="mono">' + (sdev(dl) != null ? (sdev(dl)/1000).toFixed(3) : "—") + '</td></tr>';
  });
  h += '</tbody></table></div>';
  h += lapChart(r, laps, best);
  return h;
}
function tile(k, v, s){ return '<div class="tile"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + s + '</div></div>'; }
function lapChart(r, laps, best){
  var W = 720, H = 250, L = 56, R = 16, T = 14, B = 34;
  var times = laps.map(function(l){ return l.ms; });
  var lo = Math.min.apply(null, times), hi = Math.max.apply(null, times);
  var pad = Math.max(300, (hi - lo) * 0.08); lo -= pad; hi += pad;
  var xs = function(i){ return L + (laps.length === 1 ? 0 : i * (W - L - R) / (laps.length - 1)); };
  // y axis = lap time; smaller (faster) sits at the top
  var ys = function(ms){ return T + (ms - lo) * (H - T - B) / (hi - lo); };
  var s = '<h2 style="margin-top:20px">Lap times</h2>';
  s += '<div class="legend">' + r.drivers.map(function(d){
      return '<span class="pill"><span class="dot" style="background:' + PAL[d.c % PAL.length].mark + '"></span>' + esc(d.name.split(" ")[0]) + '</span>'; }).join("")
    + '</div><div class="chart-wrap"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Lap times across the race">';
  /* y grid: 4 ticks */
  for (var g = 0; g <= 3; g++){
    var v = lo + (hi - lo) * g / 3, y = ys(v);
    s += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '" stroke="#2a3442" stroke-width="1"/>'
      + '<text x="' + (L - 8) + '" y="' + (y + 3.5) + '" fill="#6b7889" font-family="IBM Plex Mono,monospace" font-size="11" text-anchor="end">' + fmtLap(Math.round(v/100)*100) + '</text>';
  }
  /* stint boundaries + segments */
  var idx = 0;
  r.stints.forEach(function(st, si){
    if (!st.laps.length) return;
    var col = st.d ? dcol(r, st.d).mark : "#6b7889";
    var seg = st.laps.map(function(ms, li){ return {x: xs(idx + li), y: ys(ms), ms: ms, li: li}; });
    if (idx > 0) s += '<line x1="' + (xs(idx) - ((xs(idx) - xs(idx-1)) / 2)) + '" y1="' + T + '" x2="' + (xs(idx) - ((xs(idx) - xs(idx-1)) / 2)) + '" y2="' + (H - B) + '" stroke="#2a3442" stroke-dasharray="3 4"/>';
    if (seg.length > 1) s += '<path d="M' + seg.map(function(p){ return p.x + " " + p.y; }).join(" L") + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round"/>';
    seg.forEach(function(p){
      var isBest = p.ms === best;
      s += '<circle cx="' + p.x + '" cy="' + p.y + '" r="' + (isBest ? 5 : 3.5) + '" fill="' + col + '" stroke="' + (isBest ? "#e9eef5" : "#161c25") + '" stroke-width="2"><title>S' + (si+1) + ' L' + (p.li+1) + ' — ' + fmtLap(p.ms) + '</title></circle>';
    });
    s += '<text x="' + xs(idx + Math.max(0,(st.laps.length-1)/2)) + '" y="' + (H - 10) + '" fill="#6b7889" font-family="IBM Plex Mono,monospace" font-size="11" text-anchor="middle">S' + (si+1) + '</text>';
    idx += st.laps.length;
  });
  s += '</svg></div><p class="hint">Smaller is better — best lap ringed. Dashed lines mark stint changes (and kart changes with them): a step up after a swap usually means the kart, not the driver.</p>';
  return s;
}

/* ---------- render + events ---------- */
function render(){
  renderHeader(); renderTabs();
  var pane = document.getElementById("pane");
  pane.innerHTML = tab === "setup" ? paneSetup()
    : tab === "quali" ? paneQuali()
    : tab === "race" ? paneRace()
    : tab === "rivals" ? paneRivals()
    : paneAnalysis();
  save();
}

document.getElementById("tabs").addEventListener("click", function(e){
  var b = e.target.closest("[data-tab]"); if (!b) return;
  tab = b.getAttribute("data-tab"); render();
});
document.getElementById("raceSel").addEventListener("change", function(e){
  store.currentId = e.target.value; openStint = -1; stopTimers(); render();
});
document.getElementById("newRace").addEventListener("click", function(){
  var id = uid(), src = cur();
  store.races[id] = {
    meta:{ name:src.meta.name, event:"New race", track:"", date:"", green:"", stints:9, stintMin:20, link:"", notes:"" },
    drivers: src.drivers.map(function(d){ return {id:d.id, name:d.name, c:d.c}; }),
    quali:{times:{}, grid:""}, stints:[], rivals:[], ourPos:[]
  };
  normalize(store.races[id]);
  store.currentId = id; tab = "setup"; openStint = -1; stopTimers(); render();
});
document.getElementById("exportBtn").addEventListener("click", function(){
  var blob = new Blob([JSON.stringify(store, null, 1)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "sable-racing-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
});
document.getElementById("importBtn").addEventListener("click", function(){ document.getElementById("importFile").click(); });
document.getElementById("importFile").addEventListener("change", function(e){
  var f = e.target.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try {
      var inc = JSON.parse(rd.result);
      if (!inc || !inc.races) throw new Error("bad file");
      if (!confirm("Import " + Object.keys(inc.races).length + " race(s)? Same-ID races will be overwritten by the file.")) return;
      Object.keys(inc.races).forEach(function(id){ store.races[id] = inc.races[id]; normalize(store.races[id]); });
      render();
    } catch(err){ alert("Could not read that file as a Racing Manager export."); }
  };
  rd.readAsText(f);
  e.target.value = "";
});

/* pane delegation */
var paneEl = document.getElementById("pane");
paneEl.addEventListener("change", function(e){
  var t = e.target, r = cur(), a;
  if ((a = t.getAttribute("data-meta")) != null){
    r.meta[a] = t.type === "number" ? +t.value : t.value;
    if (a === "stints" || a === "stintMin"){ normalize(r); stopTimers(); }
    render();
  }
  else if ((a = t.getAttribute("data-drv"))) { var d = driverById(r, a); if (d) d.name = t.value; render(); }
  else if ((a = t.getAttribute("data-drvc"))) { var d2 = driverById(r, a); if (d2) d2.c = +t.value; render(); }
  else if ((a = t.getAttribute("data-grid")) != null || t.hasAttribute("data-grid")) { r.quali.grid = t.value; save(); }
  else if ((a = t.getAttribute("data-sd"))) { r.stints[+a].d = t.value; render(); }
  else if ((a = t.getAttribute("data-sk"))) { r.stints[+a].kart = t.value; save(); }
  else if ((a = t.getAttribute("data-sps"))) { r.stints[+a].ps = t.value; save(); }
  else if ((a = t.getAttribute("data-spe"))) { r.stints[+a].pe = t.value; save(); }
  else if ((a = t.getAttribute("data-sb"))) { r.stints[+a].best = t.value; save(); }
  else if ((a = t.getAttribute("data-sn"))) { r.stints[+a].notes = t.value; save(); }
  else if ((a = t.getAttribute("data-op"))) { r.ourPos[+a] = t.value; render(); }
  else if ((a = t.getAttribute("data-rvn"))) { r.rivals[+a].name = t.value; render(); }
  else if ((a = t.getAttribute("data-rp"))) { var pr = a.split(":"); r.rivals[+pr[0]].pos[+pr[1]] = t.value; render(); }
  else if (t.id === "swStint") { sw.stint = +t.value; }
});
paneEl.addEventListener("click", function(e){
  var t = e.target.closest("button"); if (!t) return;
  var r = cur(), a;
  if (t.id === "addDrv"){ r.drivers.push({id:uid(), name:"Driver " + (r.drivers.length+1), c:r.drivers.length % PAL.length}); render(); }
  else if ((a = t.getAttribute("data-deldrv"))){
    if (!confirm("Remove this driver? Their quali times are removed too (stint assignments are kept).")) return;
    r.drivers = r.drivers.filter(function(d){ return d.id !== a; });
    delete r.quali.times[a]; render();
  }
  else if (t.id === "delRace"){
    if (Object.keys(store.races).length === 1) { alert("This is the only race — create another one first."); return; }
    if (!confirm('Delete "' + (r.meta.event || r.meta.name) + '" and all its data? This cannot be undone.')) return;
    delete store.races[store.currentId];
    store.currentId = Object.keys(store.races)[0]; stopTimers(); render();
  }
  else if ((a = t.getAttribute("data-qbtn"))) addQuali(a);
  else if ((a = t.getAttribute("data-qdel"))){ var q = a.split(":"); r.quali.times[q[0]].splice(+q[1], 1); render(); }
  else if ((a = t.getAttribute("data-open"))){ openStint = openStint === +a ? -1 : +a; render(); }
  else if ((a = t.getAttribute("data-lbtn"))) addLap(+a);
  else if ((a = t.getAttribute("data-ldel"))){ var p = a.split(":"); r.stints[+p[0]].laps.splice(+p[1], 1); render(); }
  else if (t.id === "rivAdd"){
    var nm = document.getElementById("rivName").value.trim(); if (!nm) return;
    var rv = {name:nm, pos:[]}; r.rivals.push(rv); normalize(r); render();
  }
  else if ((a = t.getAttribute("data-rvdel"))){ r.rivals.splice(+a, 1); render(); }
  else if (t.id === "cdStart") startCountdown();
  else if (t.id === "cdStop"){ cd.running = false; render(); }
  else if (t.id === "swGo"){ sw.running = true; sw.t0 = Date.now(); sw.lastLap = sw.t0; sw.stint = +document.getElementById("swStint").value; render(); }
  else if (t.id === "swLap"){
    var now = Date.now(), ms = now - sw.lastLap; sw.lastLap = now;
    cur().stints[sw.stint].laps.push(ms); save();
    document.getElementById("swLast").textContent = "lap " + fmtLap(ms);
    var tbl = tab === "race"; if (tbl && openStint === sw.stint) render();
  }
  else if (t.id === "swStop"){ sw.running = false; render(); }
});
paneEl.addEventListener("keydown", function(e){
  if (e.key !== "Enter") return;
  var t = e.target, a;
  if ((a = t.getAttribute("data-qadd"))) { e.preventDefault(); addQuali(a); }
  else if ((a = t.getAttribute("data-ladd"))) { e.preventDefault(); addLap(+a); }
});
function addQuali(driverId){
  var inp = paneEl.querySelector('[data-qadd="' + driverId + '"]');
  var ms = parseLap(inp.value);
  if (ms == null){ inp.select(); return; }
  var r = cur();
  (r.quali.times[driverId] = r.quali.times[driverId] || []).push(ms);
  render();
  var again = paneEl.querySelector('[data-qadd="' + driverId + '"]'); if (again) again.focus();
}
function addLap(si){
  var inp = paneEl.querySelector('[data-ladd="' + si + '"]');
  var ms = parseLap(inp.value);
  if (ms == null){ inp.select(); return; }
  cur().stints[si].laps.push(ms); render();
  var again = paneEl.querySelector('[data-ladd="' + si + '"]'); if (again) again.focus();
}

/* ---------- timers ---------- */
var tick = null;
function stopTimers(){ cd.running = false; sw.running = false; }
function startCountdown(){
  cd.running = true;
  cd.endAt = Date.now() + cur().meta.stintMin * 60000;
  render();
}
setInterval(function(){
  if (tab !== "race") return;
  var face = document.getElementById("cdFace"), pr = document.getElementById("cdPrompt");
  if (face && cd.running){
    var remS = (cd.endAt - Date.now()) / 1000;
    face.textContent = fmtClock(remS);
    face.className = "clockface" + (remS <= 60 ? " crit" : remS <= 180 ? " warn" : "");
    var msg = "", crit = false;
    if (remS <= 0){ msg = "STINT OVER — ROTATE"; crit = true; if (remS < -0.5) cd.running = false; }
    else if (remS <= 60){ msg = "BOARD: IN NOW"; crit = true; }
    else if (remS <= 180){ msg = "BOARD: 3 MIN — next driver walks"; }
    else if (remS <= 300){ msg = "BOARD: 5 MIN"; }
    pr.textContent = msg;
    pr.className = "board-prompt" + (crit ? " crit" : "");
  }
  var sf = document.getElementById("swFace"), sl = document.getElementById("swLast");
  if (sf && sw.running){
    var el = (Date.now() - sw.t0) / 1000;
    sf.textContent = fmtClock(el);
    if (sl && !sl.textContent.trim()) sl.innerHTML = "current lap " + fmtLap(Date.now() - sw.lastLap);
    else if (sl && sl.textContent.indexOf("current") === 0) sl.textContent = "current lap " + fmtLap(Date.now() - sw.lastLap);
  }
}, 250);

/* ---------- boot ---------- */
load(); render();
</script>
