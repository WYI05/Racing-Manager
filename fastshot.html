<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fastshot — Describe an app. We'll build it.</title>
<meta name="description" content="Fastshot turns a written description into a working app.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=block">
<script>
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: no-preference)").matches)
    document.documentElement.classList.add("anim");
</script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  button,input,textarea{font:inherit;color:inherit;background:none;border:0}
  img,svg{display:block}
  :focus-visible{outline:2px solid #F8B285;outline-offset:3px;border-radius:4px}

  :root{
    --u: min(0.06410256vw, 0.12400794vh);
    --vu: 0.09920635vh;
    --inset-top: 41; --inset-bottom: 106;
    --font-text: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-display: Inter, var(--font-text);
    /* nav */
    --brand-x:225; --brand-y:45; --mark:34; --brand-gap:12; --brand-fs:18.49;
    --links-y:50.5; --links-gap:50; --links-fs:21.69;
    --cta-x:1195; --cta-y:42; --cta-w:140; --cta-h:43; --cta-r:12; --cta-fs:15.70; --cta-dy:2;
    /* hero */
    --hero-gap:51;
    --h1-y:323; --h1-fs:36.25; --display-ls:0.0018em;
    --nav-ls:-0.0115em; --brand-ls:-0.0154em; --cta-ls:-0.0127em; --body-ls:0.007em;
    --label-ls:normal; --model-ls:normal; --proof-ls:0.0065em;
    --w-regular:400; --w-display-wght:410; --w-medium:500; --w-semibold:600;
    --w-display:var(--w-display-wght); --w-nav:400; --w-brand:500; --w-cta:520;
    --w-body:var(--w-regular); --w-label:var(--w-medium);
    --w-model:var(--w-regular); --w-proof:480;
    /* composer */
    --card-x:425; --card-y:413; --card-w:708; --card-h:143; --card-r:26;
    --ph-x:452; --ph-y:446; --ph-fs:9.97;
    --chips-x:444; --chips-y:505; --chip-h:30; --chip-r:9; --chip-fs:9.0; --chip-gap:5.5;
    --son-fs:10.4; --son-top:15.5; --chev-gap:6.2;
    --chev-x:1013.5; --chev-y:522.3;
    --att-x:1043.2; --att-y:515.1;
    --send-x:1084; --send-y:507; --send-d:35;
    /* footer */
    --by-y:799; --by-fs:14.01; --logo-y:867; --logo-gap:62;
    --e-primary: cubic-bezier(.16,1,.3,1);
    --e-soft: cubic-bezier(.22,1,.36,1);
  }
  @supports (height:100dvh){
    :root{ --u: min(0.06410256vw, 0.12400794dvh); --vu: 0.09920635dvh; }
  }
  @media (min-width:1561px){ :root{ --inset-top:27; --inset-bottom:74; } }

  html,body{height:100%}
  body{
    background:#0a0d12; color:#fff; overflow:hidden;
    font-family:var(--font-text);
    font-synthesis:none; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    text-rendering:geometricPrecision;
  }
  a{color:inherit;text-decoration:none}

  .stage{position:fixed;inset:0;overflow:hidden;background:#0a0d12}
  .stage-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
  .frame{
    position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;
    padding: calc(var(--inset-top)*var(--vu)) calc(225*var(--u)) calc(var(--inset-bottom)*var(--vu));
  }

  /* ---------- nav ---------- */
  header.nav{position:relative;height:calc(43*var(--u));display:flex;align-items:center;justify-content:space-between;flex:none}
  .brand{display:flex;align-items:center;gap:calc(var(--brand-gap)*var(--u))}
  .brand .mark{width:calc(var(--mark)*var(--u));height:calc(var(--mark)*var(--u))}
  .brand .word{
    font-family:var(--font-display);font-size:calc(var(--brand-fs)*var(--u));font-weight:var(--w-brand);
    letter-spacing:var(--brand-ls);font-variation-settings:"opsz" 32;transform:translateY(calc(1*var(--u)));
    text-shadow:0 calc(1*var(--u)) calc(10*var(--u)) rgba(0,0,0,.30);
  }
  nav.links{
    position:absolute;left:50%;transform:translateX(-50%);
    top:calc((50.5 - 41)*var(--u));
    display:flex;gap:calc(var(--links-gap)*var(--u));
  }
  nav.links a{
    font-size:calc(var(--links-fs)*var(--u));font-weight:var(--w-nav);letter-spacing:var(--nav-ls);
    line-height:1.2;color:#fff;text-shadow:0 calc(1*var(--u)) calc(12*var(--u)) rgba(0,0,0,.32);
    transition:opacity .18s ease;
  }
  nav.links a:hover{opacity:.72}
  header .cta{
    align-self:flex-start;margin-top:calc((42 - 41)*var(--u));
    width:calc(var(--cta-w)*var(--u));height:calc(var(--cta-h)*var(--u));border-radius:calc(var(--cta-r)*var(--u));
    display:inline-flex;align-items:center;justify-content:center;
    font-size:calc(var(--cta-fs)*var(--u));font-weight:var(--w-cta);letter-spacing:var(--cta-ls);
    background:linear-gradient(180deg,#3d3d3f 0%,#1d1d20 100%);
    box-shadow:inset 0 calc(1*var(--u)) 0 rgba(255,255,255,.10), 0 calc(2*var(--u)) calc(14*var(--u)) rgba(0,0,0,.28);
    cursor:pointer;
  }
  header .cta span{transform:translateY(calc(var(--cta-dy)*var(--u)))}
  header .cta:hover{filter:brightness(1.16)}
  header .cta:active{transform:translateY(1px)}

  /* mobile menu (hidden on desktop) */
  #menu{position:absolute;opacity:0;pointer-events:none}
  .burger,.sheet{display:none}

  /* ---------- hero ---------- */
  main.hero{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:calc(var(--hero-gap)*var(--vu));padding-bottom:calc(4*var(--vu));
  }
  .h1{
    font-family:var(--font-display);font-size:calc(var(--h1-fs)*var(--u));font-weight:var(--w-display);
    line-height:1.10;letter-spacing:var(--display-ls);color:#fff;font-variation-settings:"opsz" 32;
    text-shadow:0 calc(2*var(--u)) calc(22*var(--u)) rgba(0,0,0,.30);text-align:center;
  }

  /* ---------- composer card ---------- */
  .card{
    position:relative;width:calc(var(--card-w)*var(--u));height:calc(var(--card-h)*var(--u));
    border-radius:calc(var(--card-r)*var(--u));margin-right:calc(3*var(--u));
    background:rgba(41,41,43,.955);
    -webkit-backdrop-filter:blur(calc(26*var(--u))) saturate(112%);
    backdrop-filter:blur(calc(26*var(--u))) saturate(112%);
    box-shadow:inset 0 0 0 1px rgba(214,228,255,.14), 0 calc(22*var(--u)) calc(60*var(--u)) rgba(0,0,0,.30);
  }
  .ph{
    position:absolute;left:calc(27*var(--u));top:calc(33*var(--u));right:calc(24*var(--u));
    color:#8B8C8E;font-size:calc(var(--ph-fs)*var(--u));font-weight:var(--w-body);
    line-height:1.35;letter-spacing:var(--body-ls);white-space:nowrap;overflow:hidden;
  }
  .tools{
    position:absolute;left:calc(19*var(--u));top:calc(92*var(--u));height:calc(var(--chip-h)*var(--u));
    right:calc((425 + 708 - 1134)*var(--u));
  }
  .chips{display:flex;align-items:center;gap:calc(var(--chip-gap)*var(--u));height:100%}
  .chip{
    width:calc(var(--cw)*var(--u));height:calc(var(--chip-h)*var(--u));border-radius:calc(var(--chip-r)*var(--u));
    display:inline-flex;align-items:center;padding-left:calc(var(--pl)*var(--u));gap:calc(var(--ig)*var(--u));
    font-size:calc(var(--chip-fs)*var(--u));font-weight:var(--w-label);letter-spacing:var(--label-ls);
    color:#909093;line-height:1;cursor:pointer;flex:none;
    background:linear-gradient(180deg, rgba(255,255,255,.088) 0%, rgba(255,255,255,.050) 45%, rgba(255,255,255,.038) 100%);
    border:1px solid rgba(255,255,255,.05);
  }
  .chip:hover{background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.07));color:#c8c8cb}
  .chip span{transform:translateY(calc(2*var(--u)))}
  .chip svg{flex:none}
  .ic-screens{width:calc(15.06*var(--u))}
  .ic-figma{width:calc(11.8*var(--u))}
  .ic-theme{width:calc(12.13*var(--u))}

  .right{position:absolute;inset:0;pointer-events:none}
  .right > *{position:absolute;pointer-events:auto}
  .model{
    left:calc(510.2*var(--u));top:calc(15.5*var(--u));
    display:inline-flex;align-items:center;gap:calc(var(--chev-gap)*var(--u));
    font-size:calc(var(--son-fs)*var(--u));font-weight:var(--w-model);letter-spacing:var(--model-ls);
    color:#98999C;line-height:1;cursor:pointer;
  }
  .model svg{width:calc(6.8*var(--u))}
  .attach{
    left:calc(599.15*var(--u));top:calc(10.14*var(--u));
    color:#A9AAAD;cursor:pointer;line-height:0;
  }
  .attach svg{width:calc(19.79*var(--u))}
  .attach:hover{color:#fff}
  .send{
    left:calc(640*var(--u));top:calc(2*var(--u));
    width:calc(var(--send-d)*var(--u));height:calc(var(--send-d)*var(--u));border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
    background:linear-gradient(163deg, #FBBC94 0%, #F49D70 46%, #E88654 100%);
    box-shadow:0 calc(3*var(--u)) calc(12*var(--u)) rgba(210,110,60,.34);
  }
  .send svg{width:calc(11.66*var(--u))}
  .send:hover{filter:brightness(1.07)}
  .send:active{transform:scale(.95)}

  /* ---------- proof footer ---------- */
  footer.proof{flex:none;display:flex;flex-direction:column;align-items:center;gap:calc(52.3*var(--vu))}
  .by{
    font-family:var(--font-display);font-size:calc(var(--by-fs)*var(--u));font-weight:var(--w-proof);
    letter-spacing:var(--proof-ls);color:rgba(255,255,255,.95);font-variation-settings:"opsz" 32;
    text-shadow:0 calc(1*var(--u)) calc(12*var(--u)) rgba(0,0,0,.35);
  }
  .logos{display:flex;align-items:center;gap:calc(var(--logo-gap)*var(--u));color:#fff}
  .logos svg{filter:drop-shadow(0 calc(1*var(--u)) calc(10*var(--u)) rgba(0,0,0,.30))}
  .logo-a{width:calc(96.84*var(--u))}
  .logo-b{width:calc(67.29*var(--u))}
  .logo-c{width:calc(88.68*var(--u))}

  /* ================= TABLET ================= */
  @media (min-width:600px) and (max-width:1180px) and (min-height:600px){
    :root{ --u:1px }
    .frame{padding:clamp(24px,3.4vh,44px) clamp(28px,4.2vw,60px) clamp(26px,4.4vh,56px)}
    .h1{font-size:clamp(27px,4.3vw,44px);line-height:1.12;white-space:nowrap}
    .card{
      width:min(100%, clamp(516px,74vw,760px));height:auto;margin-right:0;
      padding:clamp(15px,1.9vw,24px);border-radius:clamp(17px,2.1vw,26px);
      display:flex;flex-direction:column;gap:clamp(20px,3.2vh,44px);
    }
    .ph{position:static;white-space:normal;font-size:clamp(11px,1.35vw,14px);line-height:1.4}
    .tools{position:static;height:auto;display:flex;flex-direction:row;flex-wrap:wrap;gap:clamp(10px,1.4vw,18px);align-items:center}
    .chips{flex-wrap:nowrap;gap:clamp(6px,0.85vw,10px);height:auto}
    .chip{width:auto;height:clamp(29px,3.4vh,34px);padding:0 clamp(7px,1vw,13px);font-size:clamp(9.6px,1.12vw,12.5px)}
    .right{position:static;display:flex;align-items:center;margin-left:auto;gap:0}
    .right > *{position:static}
    .model{font-size:clamp(9.8px,1.12vw,12.5px)}
    .attach{margin-left:clamp(9px,1.4vw,20px)}
    .send{margin-left:clamp(9px,1.3vw,18px);width:clamp(32px,3.5vw,38px);height:clamp(32px,3.5vw,38px)}
    footer.proof{gap:clamp(15px,2.5vh,30px)}
  }

  /* ================= COMPACT ================= */
  @media (max-width:599px), (max-height:599px) and (max-width:1180px){
    :root{ --u:1px }
    .frame{
      padding:
        max(18px, env(safe-area-inset-top))
        max(clamp(18px,5.2vw,40px), env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(clamp(18px,5.2vw,40px), env(safe-area-inset-left));
    }
    nav.links, header .cta{display:none}
    .brand .mark{width:30px;height:30px}
    .burger{
      display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:11px;
      background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);cursor:pointer;
    }
    .burger svg{width:17px}
    .sheet{
      display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1);
    }
    #menu:checked ~ .sheet{grid-template-rows:1fr}
    .sheet-inner{overflow:hidden;min-height:0}
    .sheet-panel{
      margin-top:12px;background:rgba(24,24,27,.86);
      -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
      border-radius:16px;border:1px solid rgba(255,255,255,.09);
      padding:14px;display:flex;flex-direction:column;gap:4px;
    }
    .sheet-panel a{font-size:15px;padding:9px 8px;border-radius:9px}
    .sheet-panel a:hover{background:rgba(255,255,255,.06)}
    .sheet-panel .cta-m{
      margin-top:8px;height:40px;border-radius:11px;font-size:15px;font-weight:var(--w-cta);letter-spacing:var(--cta-ls);
      display:flex;align-items:center;justify-content:center;
      background:linear-gradient(180deg,#3d3d3f 0%,#1d1d20 100%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 2px 14px rgba(0,0,0,.28);
    }
    .h1{width:100%;max-width:15ch;font-size:clamp(29px,7.6vw,50px);line-height:1.14;letter-spacing:-.012em;margin:0 auto}
    .card{
      width:100%;max-width:600px;height:auto;margin-right:0;
      display:flex;flex-direction:column;gap:clamp(16px,4.6vh,34px);
      padding:clamp(13px,3.4vw,18px);border-radius:clamp(17px,2.1vw,26px);
    }
    .ph{position:static;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(9.4px,2.95vw,14px);line-height:1.4}
    .tools{position:static;height:auto;display:flex;flex-direction:column;align-items:stretch;gap:12px}
    .chips{flex-wrap:wrap;height:auto;gap:6px}
    .chip{width:auto;height:30px;padding:0 11px;font-size:clamp(9.6px,2.6vw,12px)}
    .right{position:static;display:flex;align-items:center;justify-content:flex-start}
    .right > *{position:static}
    .model{font-size:clamp(9.8px,2.6vw,12px)}
    .attach{margin-left:auto}
    .send{margin-left:14px;width:40px;height:40px}
    footer.proof{gap:clamp(15px,2.5vh,30px)}
    .logos{gap:clamp(18px,6.5vw,62px)}
    .logo-a{width:clamp(64px,19vw,96.84px)}
    .logo-b{width:clamp(45px,13.5vw,67.29px)}
    .logo-c{width:clamp(59px,17.5vw,88.68px)}
  }
  @media (max-width:1180px) and (max-height:560px){
    main.hero{gap:16px}
    .h1{font-size:clamp(24px,5.4vh,34px)}
    footer.proof{gap:10px}
    .frame{padding-top:10px}
  }

  /* ================= ENTRANCE ================= */
  @media (prefers-reduced-motion: no-preference){
    @keyframes e-settle-down{from{opacity:0;transform:translateY(calc(-5*var(--u)))}to{opacity:1;transform:none}}
    @keyframes e-settle-up{from{opacity:0;transform:translateY(calc(6*var(--u)))}to{opacity:1;transform:none}}
    @keyframes e-mark{from{transform:scale(.9)}to{transform:none}}
    @keyframes e-focus{from{opacity:0;transform:translateY(calc(14*var(--u)));filter:blur(calc(6*var(--u)))}to{opacity:1;transform:none;filter:blur(0)}}
    @keyframes e-panel{from{opacity:0;transform:translateY(calc(18*var(--u))) scale(.985)}to{opacity:1;transform:none}}
    @keyframes e-populate{from{opacity:0;transform:translateY(calc(4*var(--u)))}to{opacity:1;transform:none}}
    @keyframes e-send{from{transform:scale(.82)}to{transform:none}}
    html.anim .brand{animation:e-settle-down .58s var(--e-soft) .06s both}
    html.anim .brand .mark{animation:e-mark .62s var(--e-primary) .06s both}
    html.anim nav.links a{animation:e-settle-down .50s var(--e-soft) both}
    html.anim nav.links a:nth-child(1){animation-delay:.16s}
    html.anim nav.links a:nth-child(2){animation-delay:.21s}
    html.anim nav.links a:nth-child(3){animation-delay:.26s}
    html.anim nav.links a:nth-child(4){animation-delay:.31s}
    html.anim header .cta{animation:e-settle-down .55s var(--e-soft) .34s both}
    html.anim .h1{animation:e-focus 1.00s var(--e-primary) .30s both;will-change:transform,opacity}
    html.anim .card{animation:e-panel .90s var(--e-primary) .62s both;will-change:transform,opacity}
    html.anim .ph{animation:e-populate .50s var(--e-soft) .88s both}
    html.anim .chips{animation:e-populate .50s var(--e-soft) .94s both}
    html.anim .right{animation:e-populate .50s var(--e-soft) 1.00s both}
    html.anim .send{animation:e-send .50s var(--e-primary) 1.00s both}
    html.anim .by{animation:e-settle-up .55s var(--e-soft) 1.08s both}
    html.anim .logos svg{animation:e-settle-up .55s var(--e-soft) both}
    html.anim .logos svg:nth-child(1){animation-delay:1.16s}
    html.anim .logos svg:nth-child(2){animation-delay:1.22s}
    html.anim .logos svg:nth-child(3){animation-delay:1.28s}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="stage">
  <video class="stage-video" autoplay muted loop playsinline
    src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260826_124724_bc041163-d651-425f-aea3-2acc1efc2c96.mp4"></video>

  <div class="frame">
    <input type="checkbox" id="menu">

    <header class="nav">
      <a class="brand" href="#" aria-label="Fastshot home">
        <svg class="mark" viewBox="0 0 34 34" aria-hidden="true">
          <circle cx="17" cy="17" r="17" fill="#9C86CE"/>
          <circle cx="17" cy="17" r="8.6" fill="#FFFFFF"/>
          <circle cx="17" cy="17" r="3.7" fill="#151519"/>
        </svg>
        <span class="word">Fastshot</span>
      </a>

      <nav class="links" aria-label="Primary">
        <a href="#">Features</a>
        <a href="#">Examples</a>
        <a href="#">Pricing</a>
        <a href="#">Docs</a>
      </nav>

      <label class="burger" for="menu" aria-label="Menu">
        <svg viewBox="0 0 17 12" aria-hidden="true">
          <rect x="0" y="0" width="17" height="2" rx="1" fill="#fff"/>
          <rect x="0" y="10" width="17" height="2" rx="1" fill="#fff"/>
        </svg>
      </label>

      <button class="cta" type="button"><span>Get Started</span></button>
    </header>

    <div class="sheet">
      <div class="sheet-inner">
        <div class="sheet-panel">
          <a href="#">Features</a>
          <a href="#">Examples</a>
          <a href="#">Pricing</a>
          <a href="#">Docs</a>
          <button class="cta-m" type="button">Get Started</button>
        </div>
      </div>
    </div>

    <main class="hero">
      <h1 class="h1">Describe an app. We'll build it.</h1>

      <form class="card" onsubmit="return false">
        <p class="ph">Build a fintech tracking app with bank level privacy and...</p>

        <div class="tools">
          <div class="chips">
            <button class="chip" type="button" style="--cw:107;--pl:12;--ig:3.7">
              <svg class="ic-screens" viewBox="0 0 20 16" fill="currentColor" aria-hidden="true">
                <path d="M2.2 0h9.6A2.2 2.2 0 0 1 14 2.2v5.6A2.2 2.2 0 0 1 11.8 10H2.2A2.2 2.2 0 0 1 0 7.8V2.2A2.2 2.2 0 0 1 2.2 0Z"/>
                <path d="M8.2 6h9.6A2.2 2.2 0 0 1 20 8.2v5.6a2.2 2.2 0 0 1-2.2 2.2H8.2A2.2 2.2 0 0 1 6 13.8v-3h5.8a3.2 3.2 0 0 0 3.2-3.2V6h-6.8Z" opacity=".75"/>
              </svg>
              <span>Attach Screens</span>
            </button>
            <button class="chip" type="button" style="--cw:108;--pl:16;--ig:3.9">
              <svg class="ic-figma" viewBox="0 0 12 17" fill="currentColor" aria-hidden="true">
                <path d="M3 0h3v5.6H3A2.8 2.8 0 0 1 3 0Z"/>
                <path d="M6 0h3a2.8 2.8 0 0 1 0 5.6H6V0Z" opacity=".8"/>

<script>
(function(){
  var d = document.documentElement;
  if (!d.classList.contains("anim")) return;
  var done = function(){ d.classList.remove("anim"); };
  var t = setTimeout(done, 2600);
  var logos = document.querySelectorAll(".logos svg");
  var last = logos[logos.length - 1];
  if (last) last.addEventListener("animationend", function(){ clearTimeout(t); done(); }, { once:true });
})();
</script>
